name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PachiAI.apk
      - name: Keep a copy in Actions
        uses: actions/upload-artifact@v4
        with:
          name: PachiAI-debug-apk
          path: PachiAI.apk
      - name: Publish to Releases (phone download page)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: PachiAI 최신 APK
          body: PachiAI.apk 를 눌러 내려받아 설치하세요.
          files: PachiAI.apk
          make_latest: true
